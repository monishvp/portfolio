<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00d4ff" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Dark Rounded Hexagonal / Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#0a0a0a" stroke="url(#grad)" stroke-width="2.5" />

  <!-- Monish 'M' with accent dot -->
  <path d="M17 44V20L28 35L36 24V44" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Electric Cyan Dot -->
  <circle cx="47" cy="42" r="3.5" fill="#00d4ff" filter="url(#glow)" />
</svg>
