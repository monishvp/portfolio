<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  
  <!-- Dark Rounded Square Background with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0d12" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Subtle inner gradient glow on top-right -->
  <circle cx="50" cy="14" r="16" fill="#00d4ff" opacity="0.12" />

  <!-- Bold "M" Lettermark -->
  <text 
    x="24" 
    y="44" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="34" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="-1">M</text>
  
  <!-- Cyan Accent Dot matching "Monish." brand wordmark -->
  <circle cx="45" cy="41" r="5" fill="#00d4ff" />
</svg>
